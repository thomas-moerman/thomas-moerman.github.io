<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.layout == 'post' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 155 | escape | default: site.description }}">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body id="top">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="sheet hdr">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="t/m thomas moerman, home"><span class="mk"><b>t/m</b><span>thomas<br>moerman</span></span></a>
    <nav class="nav label" aria-label="Main">
      <a href="{{ '/' | relative_url }}#about"><span class="n" aria-hidden="true">01</span>about</a>
      <a href="{{ '/' | relative_url }}#work"><span class="n" aria-hidden="true">02</span>work</a>
      <a href="{{ '/' | relative_url }}#notes"><span class="n" aria-hidden="true">03</span>notes</a>
      <a href="{{ '/' | relative_url }}#contact"><span class="n" aria-hidden="true">04</span>contact</a>
    </nav>
    <div class="progress" aria-hidden="true"></div>
  </div>
</header>
<main id="main">
<div class="sheet">
{{ content }}
</div>
</main>
<footer class="site-footer on-blue">
  <div class="sheet tblock">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="t/m thomas moerman, home"><span class="mk"><b>t<i class="sl">/</i>m</b><span>thomas<br>moerman</span></span></a>
    <span class="name label">thomas/moerman</span>
    <span class="yr label">© 2026</span>
    <a class="up label" href="#top">back to top <i aria-hidden="true">↑</i></a>
  </div>
</footer>
</body>
</html>
